[project]
name = "drift-to-deploy"
version = "0.1.0"
description = "An automated credit-risk ML lifecycle: drift detection, retraining, gated champion/challenger promotion."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Rhishikesh Jayakumar" }]
dependencies = [
    "lightgbm>=4.7.0",
    "mlflow>=3.16.1",
    "numpy>=1.26",
    "pandas>=2.2",
    "pandera>=0.24",
    "pyarrow>=17",
    "pydantic>=2.8",
    "pyyaml>=6",
    "scikit-learn>=1.9.1",
    "xlrd>=2.0",
]

[project.scripts]
d2d = "drift_to_deploy.cli:main"

[dependency-groups]
dev = [
    "dvc>=3.50",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drift_to_deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
