# Parameters for the data pipeline (dvc.yaml). Changing any of these re-runs the affected stages.

seed: 42

source:
  url: https://archive.ics.uci.edu/static/public/350/default+of+credit+card+clients.zip
  # Pinned so a changed or corrupted upstream file fails loudly instead of silently shifting results.
  sha256: 56c885f84457f6680f8438f02bfcdac9579323d8a94465ee5f26e32baa727602

batches:
  # Customers the first model is trained on.
  reference_size: 12000
  # Customers then arrive as a stream of monthly batches. The stream leaves some rows
  # unused on purpose: over-representing a segment (see young_customers) needs spare
  # customers of that segment to draw from, without reusing anyone.
  months: 12
  month_size: 1000

# Each scenario starts at `start_month` and stays in effect for every later month.
scenarios:
  # Banks cut credit limits and balances grow. Inputs move; how people default doesn't.
  - name: income_squeeze
    kind: covariate
    start_month: 4
    limit_bal_factor: 0.7
    bill_amt_factor: 1.25

  # A marketing push brings in many more young customers.
  - name: young_customers
    kind: population
    start_month: 7
    age_below: 30
    share: 0.55

  # A shock: customers near their limit who always paid on time start defaulting.
  # A relationship the original model never saw.
  - name: utilisation_shock
    kind: concept
    start_month: 10
    min_utilisation: 0.8
    flip_probability: 0.3

model:
  # Name in the MLflow model registry.
  name: credit-default
  validation_size: 0.2
  # Deliberately conservative: a model that generalises beats one that wins the validation set.
  lightgbm:
    n_estimators: 300
    learning_rate: 0.03
    num_leaves: 15
    min_child_samples: 80
    subsample: 0.8
    subsample_freq: 1
    colsample_bytree: 0.8
    reg_lambda: 1.0
  logistic:
    C: 0.5

monitoring:
  # Outcomes arrive late: a month's defaults are only known this many months later.
  label_lag_months: 2
  # Per-column drift: Wasserstein distance (numeric) or Jensen-Shannon distance (categorical).
  column_drift_threshold: 0.1
  # One drifted column is usually noise; this share of the model's inputs drifting is not.
  drifted_share_alert: 0.25
  # Drift in the model's output distribution, on the same distance scale.
  score_drift_alert: 0.1
  # Measured once labels arrive, against the serving model's own validation AUC.
  auc_drop_alert: 0.03
  # Gap between the predicted and observed default rate.
  calibration_gap_alert: 0.04
  # Too few labelled outcomes make AUC noisy.
  min_labelled_rows: 500
  # After a retrain, wait this many months before triggering another.
  cooldown_months: 2
